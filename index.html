<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق طمنّي - متابعة العائلة</title>
    <style>
        body { font-family: Tahoma, Arial, sans-serif; background-color: #eef2f6; margin: 0; padding: 20px; }
        .card { max-width: 450px; margin: auto; background: #fff; padding: 22px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #0f9d58; margin-bottom: 5px; }
        p.sub { text-align: center; color: #666; font-size: 14px; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; font-weight: bold; color: #333; }
        input, select, button { width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #ccc; border-radius: 10px; box-sizing: border-box; font-size: 16px; }
        button.btn-checkin { background-color: #0f9d58; color: white; border: none; font-weight: bold; margin-top: 20px; cursor: pointer; }
        button.btn-checkin:hover { background-color: #0b8043; }
        .log-item { background: #f8f9fa; border-right: 4px solid #0f9d58; padding: 12px; margin-top: 12px; border-radius: 8px; font-size: 14px; }
        .wa-link { display: inline-block; margin-top: 8px; background: #25D366; color: white; padding: 6px 12px; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 13px; }
    </style>
</head>
<body>

<div class="card">
    <h2>تطبيق طمنّي</h2>
    <p class="sub">مشاركة الوصول والموقع الجغرافي طواعية</p>

    <label>الاسم:</label>
    <input type="text" id="childName" placeholder="اكتب اسمك هنا...">

    <label>الحالة الحالية:</label>
    <select id="status">
        <option value="وصلت إلى المدرسة بسلام">وصلت إلى المدرسة بسلام</option>
        <option value="وصلت إلى المنزل بسلام">وصلت إلى المنزل بسلام</option>
        <option value="أنهيت الدرس وسأتحرك الآن">أنهيت الدرس وسأتحرك الآن</option>
        <option value="أنا بخير في مكان آمن">أنا بخير في مكان آمن</option>
    </select>

    <label>رقم واتساب ولي الأمر (اختياري للإرسال السريع):</label>
    <input type="tel" id="parentPhone" placeholder="مثال: 2010xxxxxxxx">

    <button class="btn-checkin" onclick="sendCheckIn()">تسجيل الوصول ومشاركة الموقع</button>

    <h3 style="margin-top: 25px; color: #444; font-size: 16px;">سجل التحديثات:</h3>
    <div id="logs"></div>
</div>

<script>
    function sendCheckIn() {
        const name = document.getElementById('childName').value.trim();
        const status = document.getElementById('status').value;
        const phone = document.getElementById('parentPhone').value.trim();

        if (!name) {
            alert('يرجى كتابة الاسم أولاً.');
            return;
        }

        const time = new Date().toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

        if (!navigator.geolocation) {
            alert('المتصفح لا يدعم تحديد الموقع.');
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const mapUrl = `https://google.com{lat},${lon}`;
                addLog(name, status, time, mapUrl, phone);
            },
            () => {
                alert('يرجى السماح للمتصفح بالوصول للموقع الجغرافي لتسجيل المكان.');
                addLog(name, status, time, null, phone);
            }
        );
    }

    function addLog(name, status, time, mapUrl, phone) {
        const logs = document.getElementById('logs');
        const div = document.createElement('div');
        div.className = 'log-item';

        let message = `تحديث من (${name}): ${status} - الساعة ${time}`;
        if (mapUrl) {
            message += ` | الموقع: ${mapUrl}`;
        }

        let waButton = '';
        if (phone) {
            const cleanPhone = phone.replace(/[^0-9]/g, '');
            waButton = `<br><a class="wa-link" href="https://wa.me{cleanPhone}?text=${encodeURIComponent(message)}" target="_blank">إرسال التحديث عبر واتساب</a>`;
        }

        div.innerHTML = `<strong>${name}</strong> - <span style="color:#666">${time}</span><br>الحالة: ${status}` +
            (mapUrl ? `<br><a href="${mapUrl}" target="_blank">عرض الموقع على الخريطة</a>` : '') +
            waButton;

        logs.prepend(div);
    }
</script>

</body>
</html>
